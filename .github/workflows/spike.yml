name: Spike binaries

# Temporary (M0): builds iroh-spike for every release target and publishes them
# as the `spike` pre-release, so someone without Rust can run the connection test.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p iroh-spike --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf "iroh-spike-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" iroh-spike
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/iroh-spike.exe" -DestinationPath "iroh-spike-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: iroh-spike-${{ matrix.target }}.*

  publish:
    needs: build
    # Publish whatever built: one failing target shouldn't block the test.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spike --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create spike dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "iroh spike (temporary, M0)" \
            --notes "Throwaway connection test, not the app. Download the file for your system, unpack it, run \`iroh-spike listen\` on one machine and \`iroh-spike dial <key>\` on the other."
