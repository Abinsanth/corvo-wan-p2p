[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Abinsanth/corvo-wan-p2p"

[workspace.dependencies]
corvo-wan-p2p-core = { path = "crates/corvo-wan-p2p-core" }
anyhow = "1.0.104"
bip39 = "3.0.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
hkdf = "0.13.0"
iroh = "1.3.0"
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
rand = "0.10.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Smaller downloads for the release binaries.
[profile.release]
strip = true
