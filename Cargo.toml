[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Abinsanth/corvo-wan-p2p"

[workspace.dependencies]
corvo-wan-p2p-core = { path = "crates/corvo-wan-p2p-core" }
anyhow = "1.0.104"
argon2 = "0.6.0"
bip39 = "3.0.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
hkdf = "0.13.0"
hmac = "0.13.0"
iroh = "1.3.0"
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
ulid = "3.0.0"
unicode-normalization = "0.1.25"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

# Smaller downloads for the release binaries.
[profile.release]
strip = true

# Argon2id is deliberately slow; unoptimised it makes debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
